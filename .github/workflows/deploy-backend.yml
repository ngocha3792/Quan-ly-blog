name: Deploy backend

# Tự động deploy backend lên VPS mỗi khi có push vào develop chạm tới backend/.
# Chiến lược: build image ngay trên GitHub Actions runner (nhanh, nhiều tài
# nguyên hơn VPS), nén lại rồi chuyển thẳng sang VPS bằng scp + docker load —
# không dùng container registry, không build trên VPS (VPS cấu hình yếu).
#
# Yêu cầu secret cấp ở Settings > Secrets and variables > Actions:
#   DEPLOY_SSH_KEY  — private key (đã add public key tương ứng vào
#                     ~/.ssh/authorized_keys trên VPS, dùng riêng cho CI,
#                     không phải key cá nhân).

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  DEPLOY_HOST: 103.72.57.142
  DEPLOY_PATH: /opt/blog-api/backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          tags: blog-api-runtime:ci
          outputs: type=docker,dest=/tmp/blog-api-runtime.tar
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migration
          tags: blog-api-migration:ci
          outputs: type=docker,dest=/tmp/blog-api-migration.tar
          cache-from: type=gha,scope=backend-migration
          cache-to: type=gha,mode=max,scope=backend-migration

      - name: Compress images
        run: gzip -f /tmp/blog-api-runtime.tar /tmp/blog-api-migration.tar

      - name: Package deploy config bundle (compose, nginx, scripts)
        run: tar -czf /tmp/deploy-config.tar.gz -C backend compose.prod.yml docker scripts

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' phòng trường hợp secret bị dính CRLF khi paste từ Windows
          # (Notepad...) — OpenSSH sẽ báo "error in libcrypto" nếu key có \r.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship artifacts to server
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/blog-api-runtime.tar.gz /tmp/blog-api-migration.tar.gz /tmp/deploy-config.tar.gz \
            "root@${{ env.DEPLOY_HOST }}:/tmp/"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ env.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/blog-api/backend

          tar -xzf /tmp/deploy-config.tar.gz -C /opt/blog-api/backend
          rm -f /tmp/deploy-config.tar.gz

          gunzip -c /tmp/blog-api-runtime.tar.gz | docker load
          gunzip -c /tmp/blog-api-migration.tar.gz | docker load
          rm -f /tmp/blog-api-runtime.tar.gz /tmp/blog-api-migration.tar.gz

          docker tag blog-api-runtime:ci blog-api-runtime:local
          docker tag blog-api-migration:ci blog-api-migration:local

          # Backup trước khi migrate. Không chặn deploy nếu backup lỗi, nhưng có log lại.
          ./scripts/backup-postgres.sh || echo "!! backup-postgres.sh thất bại, tiếp tục deploy"

          # -T bắt buộc: không có nó, `docker compose run` gắn vào stdin và sẽ
          # "nuốt" mất phần script còn lại đang được feed qua heredoc SSH này.
          API_IMAGE=blog-api-runtime:local MIGRATION_IMAGE=blog-api-migration:local \
            docker compose --env-file .env.production -f compose.prod.yml run --rm -T migrate

          API_IMAGE=blog-api-runtime:local MIGRATION_IMAGE=blog-api-migration:local \
            docker compose --env-file .env.production -f compose.prod.yml up -d --force-recreate api nginx

          status="starting"
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' blog-backend-prod-api-1 2>/dev/null || echo starting)
            [ "$status" = healthy ] && break
            sleep 3
          done
          if [ "$status" != healthy ]; then
            echo "API container không healthy sau deploy" >&2
            docker logs blog-backend-prod-api-1 --tail 50
            exit 1
          fi

          docker image prune -f
          REMOTE

      - name: Smoke test
        run: |
          curl --fail --max-time 10 "http://${{ env.DEPLOY_HOST }}/api/v1/health/live"
          curl --fail --max-time 10 "http://${{ env.DEPLOY_HOST }}/api/v1/health/ready"
