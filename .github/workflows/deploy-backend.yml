name: Deploy backend

# (debug: chạm trực tiếp file workflow để test push-trigger — sẽ xoá dòng
# này ở commit sau khi xác nhận trigger hoạt động lại)
# Blue-green deploy qua GHCR. Push vào develop (chạm backend/) chạy 3 job
# tuần tự — một job fail thì job sau không chạy, không có deployment nào
# xảy ra:
#
#   ci (lint/test/build/prisma validate)
#     -> build-push (build 2 image, push GHCR, tag = commit SHA, KHÔNG :latest)
#     -> deploy (SSH vào VPS, chạy scripts/deploy-blue-green.sh <sha>)
#
# VPS chỉ pull image đã build sẵn từ GHCR, không tự build (VPS quá yếu).
# Chi tiết kiến trúc blue-green + runbook bootstrap/rollback: xem
# DEPLOYMENT.md.
#
# Secret cần có ở Settings > Secrets and variables > Actions:
#   DEPLOY_SSH_KEY — private key riêng cho CI (xem DEPLOYMENT.md mục 3).
# GHCR push dùng GITHUB_TOKEN có sẵn (permissions: packages: write ở dưới),
# không cần secret riêng. VPS tự docker login ghcr.io một lần thủ công lúc
# bootstrap (DEPLOYMENT.md mục 3b) — không đi qua CI mỗi lần deploy.

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  DEPLOY_HOST: 103.72.57.142
  DEPLOY_PATH: /opt/blog-api/backend
  API_REPO: ghcr.io/ngocha3792/quan-ly-blog-api
  MIGRATION_REPO: ghcr.io/ngocha3792/quan-ly-blog-migration

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Chỉ validate cú pháp/relation của schema, không connect DB thật —
      # DATABASE_URL ở đây là giá trị giả, giống cách Dockerfile làm cho
      # `prisma generate` lúc build image.
      - name: Prisma validate
        env:
          DATABASE_URL: 'postgresql://user:password@localhost:5432/db?schema=public'
        run: npx prisma validate --schema database/schema.prisma

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ${{ env.API_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production

      - name: Build + push migration image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migration
          push: true
          tags: ${{ env.MIGRATION_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=backend-migration
          cache-to: type=gha,mode=max,scope=backend-migration

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' phòng trường hợp secret bị dính CRLF khi paste từ Windows
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship compose/nginx/scripts sang VPS
        run: |
          tar -czf /tmp/deploy-config.tar.gz -C backend \
            compose.shared.yml compose.slot.yml docker scripts
          scp -i ~/.ssh/deploy_key /tmp/deploy-config.tar.gz \
            "root@${{ env.DEPLOY_HOST }}:/tmp/"

      - name: Deploy trên VPS (blue-green)
        # github.sha luôn là 40 ký tự hex, an toàn để chèn thẳng vào script —
        # không có shell metacharacter nào cần lo injection ở đây.
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ env.DEPLOY_HOST }}" bash -s <<REMOTE
          set -euo pipefail
          cd "${{ env.DEPLOY_PATH }}"

          tar -xzf /tmp/deploy-config.tar.gz -C "${{ env.DEPLOY_PATH }}"
          rm -f /tmp/deploy-config.tar.gz
          chmod +x scripts/*.sh scripts/lib/*.sh

          flock -n .deploy.lock ./scripts/deploy-blue-green.sh "${{ github.sha }}"
          REMOTE

      - name: Smoke test domain công khai (lớp kiểm tra thứ hai, ngoài VPS)
        run: |
          curl --fail --max-time 10 "https://blogy.id.vn/api/v1/health/live"
          curl --fail --max-time 10 "https://blogy.id.vn/api/v1/health/ready"
          curl --fail --max-time 10 "https://blogy.id.vn/api/v1/posts?limit=1"
