name: blog-backend-prod

# File starter cho production một VPS. Trước khi dùng thật:
#   - Thay API_IMAGE/MIGRATION_IMAGE bằng image đã build & push lên registry
#     (không build tại chỗ trong compose.prod.yml).
#   - Nếu dùng managed PostgreSQL, bỏ hẳn service "postgres" và trỏ
#     DATABASE_URL sang endpoint private của DB.
#   - Đổi domain trong docker/nginx.conf và gắn certificate TLS thật.
#
# Chạy:
#   docker compose --env-file .env.production -f compose.prod.yml pull
#   docker compose --env-file .env.production -f compose.prod.yml run --rm migrate
#   docker compose --env-file .env.production -f compose.prod.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # Bỏ service này nếu dùng managed PostgreSQL.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Không publish 5432 ra ngoài Internet.

  migrate:
    image: ${MIGRATION_IMAGE:-blog-api-migration:latest}
    env_file:
      - .env.production
    networks:
      - backend
    restart: 'no'

  api:
    image: ${API_IMAGE:-blog-api-runtime:latest}
    env_file:
      - .env.production
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 1

  # Angular SSR (blog-frontend). Bỏ service này nếu chỉ deploy API.
  frontend:
    image: ${FRONTEND_IMAGE:-blog-frontend-runtime:latest}
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  blog_postgres_data:
