name: blog-backend-prod

# File starter cho production một VPS. Trước khi dùng thật:
#   - Thay API_IMAGE/MIGRATION_IMAGE bằng image đã build & push lên registry
#     (không build tại chỗ trong compose.prod.yml).
#   - Nếu dùng managed PostgreSQL, bỏ hẳn service "postgres" và trỏ
#     DATABASE_URL sang endpoint private của DB.
#   - Đổi domain trong docker/nginx.conf và gắn certificate TLS thật.
#
# Chạy:
#   docker compose --env-file .env.production -f compose.prod.yml pull
#   docker compose --env-file .env.production -f compose.prod.yml run --rm migrate
#   docker compose --env-file .env.production -f compose.prod.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # Bỏ service này nếu dùng managed PostgreSQL.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Không publish 5432 ra ngoài Internet.

  migrate:
    image: ${MIGRATION_IMAGE:-blog-api-migration:latest}
    env_file:
      - .env.production
    networks:
      - backend
    restart: 'no'

  api:
    image: ${API_IMAGE:-blog-api-runtime:latest}
    env_file:
      - .env.production
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 1

  # Angular SSR (blog-frontend). Bỏ service này nếu chỉ deploy API.
  frontend:
    image: ${FRONTEND_IMAGE:-blog-frontend-runtime:latest}
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Dịch tự động (LibreTranslate). ĐANG TẮT — KHÔNG chạy được trên VPS hiện
  # tại (16GB đĩa / 1.9GB RAM). Đã thử thật ngày 2026-09-03: một layer của
  # image chính thức đã ~3GB, tải dở đã ăn gần hết đĩa trống (phải hủy giữa
  # chừng). Ngoài ra mỗi cặp ngôn ngữ khi *chạy* tốn thêm ~1-2GB RAM — dù
  # tải xong cũng không đủ RAM để chạy nổi 1 ngôn ngữ cùng lúc với
  # api/postgres/frontend hiện có. Xem DEPLOYMENT.md mục "Dịch tự động" để
  # biết các hướng đã cân nhắc (nâng VPS, API trả phí, MyMemory free API).
  #
  # Chỉ bật lại khi đã nâng VPS lên tối thiểu ~20GB đĩa + 4GB RAM riêng cho
  # service này, hoặc thay bằng image/API khác nhẹ hơn.
  libretranslate:
    image: libretranslate/libretranslate:v1.6.5
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${TRANSLATE_LOAD_ONLY:-en,vi,fr,ja,ko,zh}
      LT_DISABLE_WEB_UI: 'true'
      LT_UPDATE_MODELS: 'false'
    volumes:
      - libretranslate_models:/home/libretranslate/.local/share
    networks:
      - backend
    # Giới hạn cứng: nếu vượt mức, Docker chỉ kill riêng container này,
    # không để nó ăn hết RAM kéo sập Postgres/API theo.
    deploy:
      resources:
        limits:
          memory: ${TRANSLATE_MEM_LIMIT:-1200M}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/languages || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  edge:
  backend:
    internal: true

volumes:
  blog_postgres_data:
  libretranslate_models:
