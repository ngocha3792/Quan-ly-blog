name: blog-backend-prod

# File starter cho production một VPS. Trước khi dùng thật:
#   - Thay API_IMAGE/MIGRATION_IMAGE bằng image đã build & push lên registry
#     (không build tại chỗ trong compose.prod.yml).
#   - Nếu dùng managed PostgreSQL, bỏ hẳn service "postgres" và trỏ
#     DATABASE_URL sang endpoint private của DB.
#   - Đổi domain trong docker/nginx.conf và gắn certificate TLS thật.
#
# Chạy:
#   docker compose --env-file .env.production -f compose.prod.yml pull
#   docker compose --env-file .env.production -f compose.prod.yml run --rm migrate
#   docker compose --env-file .env.production -f compose.prod.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # One-shot lấy/renew certificate Let's Encrypt (webroot mode — Nginx phục
  # vụ challenge qua volume certbot_webroot dùng chung).
  #
  # Lấy cert lần đầu (Nginx phải đang chạy ở chế độ chỉ-HTTP trước, xem
  # DEPLOYMENT.md mục "HTTPS"):
  #   docker compose -f compose.prod.yml run --rm certbot certonly \
  #     --webroot -w /var/www/certbot \
  #     -d mainbloggy.duckdns.org \
  #     --email <email-thật> --agree-tos --no-eff-email
  #
  # Renew (cron gọi định kỳ, xem crontab mẫu trong DEPLOYMENT.md):
  #   docker compose -f compose.prod.yml run --rm certbot renew --quiet
  #   docker compose -f compose.prod.yml exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./docker/certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  # Bỏ service này nếu dùng managed PostgreSQL.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Không publish 5432 ra ngoài Internet.

  migrate:
    image: ${MIGRATION_IMAGE:-blog-api-migration:latest}
    env_file:
      - .env.production
    networks:
      - backend
    restart: 'no'

  api:
    image: ${API_IMAGE:-blog-api-runtime:latest}
    env_file:
      - .env.production
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 1

  # Angular SSR (blog-frontend). Bỏ service này nếu chỉ deploy API.
  frontend:
    image: ${FRONTEND_IMAGE:-blog-frontend-runtime:latest}
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Dịch tự động (LibreTranslate) — bản build riêng, chỉ en+vi, bake model
  # sẵn vào image lúc build (không tải lúc chạy). Image chính thức nặng
  # ~8.68GB vì kéo theo CUDA/nvidia dù chạy CPU; bản này build từ
  # docker/libretranslate/Dockerfile.cpu-slim, ép torch bản CPU-only và gỡ
  # nvidia-*/triton, còn ~2.25GB. Chi tiết + cách build lại: xem
  # docker/libretranslate/README.md và DEPLOYMENT.md mục "Dịch tự động".
  #
  # Image KHÔNG build tại chỗ ở đây (không có Dockerfile context cho nó
  # trong repo backend theo chuẩn build của compose) — build trên máy có
  # tài nguyên rồi `docker save | ssh | docker load` xuống VPS, giống hệt
  # cách build/deploy api và frontend.
  libretranslate:
    image: ${TRANSLATE_IMAGE:-libretranslate-cpu-slim:4lang}
    restart: unless-stopped
    environment:
      LT_DISABLE_WEB_UI: 'true'
      LT_UPDATE_MODELS: 'false'
      # 1 worker là đủ cho traffic dịch của một blog cá nhân, và tiết kiệm
      # đáng kể RAM — mỗi worker gunicorn load riêng bản sao model dịch.
      LT_THREADS: '1'
    networks:
      - backend
    # Giới hạn cứng: nếu vượt mức, Docker chỉ kill riêng container này,
    # không để nó ăn hết RAM kéo sập Postgres/API theo. Test thật với 1
    # worker, 4 ngôn ngữ (en/vi/zh/ja, 6 model, cả 2 chiều đã dùng hết):
    # idle ~278MB, peak ~1.074GB — đặt cap 1300M để còn margin thật.
    # Model không tự giải phóng khỏi RAM sau khi dùng, nên peak này là mức
    # cần tính cho lâu dài, không phải trường hợp hiếm.
    deploy:
      resources:
        limits:
          memory: ${TRANSLATE_MEM_LIMIT:-1300M}
    healthcheck:
      # Image final stage (python:3.11-slim) không có wget/curl, chỉ có
      # Python — dùng urllib thay vì cài thêm gói cho healthcheck.
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  edge:
  backend:
    internal: true

volumes:
  blog_postgres_data:
  certbot_webroot:
