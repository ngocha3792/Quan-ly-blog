name: blog-api

services:
  migration:
    image: blog-api-migration:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_LOG_QUERIES: "false"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: blog-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_LOG_QUERIES: "false"
      APP_PORT: "8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    expose:
      - "8080"
    restart: unless-stopped
    init: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
