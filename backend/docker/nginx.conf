# Nginx reverse proxy — Blog API + Blog Frontend.
# Domain: mainbloggy.duckdns.org (DuckDNS trỏ về IP VPS này).

upstream blog_api {
    # Nếu scale nhiều API replica, Docker DNS round-robin qua tên service "api".
    server api:8080;
}

# SSR server của Angular (blog-frontend). Bỏ khối này nếu chỉ deploy API.
upstream blog_frontend {
    server frontend:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name mainbloggy.duckdns.org;

    client_max_body_size 20m;

    # Certbot webroot challenge — phải phục vụ được qua HTTP thường,
    # kể cả sau khi đã bật redirect sang HTTPS bên dưới.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Đã có certificate thật — mọi request HTTP khác redirect sang HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mainbloggy.duckdns.org;

    ssl_certificate     /etc/nginx/certs/live/mainbloggy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/mainbloggy.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # API luôn ở dưới /api/v1/*, khớp trước để không bị "location /" nuốt mất.
    location /api/v1/ {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # Tạm tăng lên 180s (mặc định 60s) để có thời gian test tính năng
        # dịch tự động — request tạo/sửa bài dịch nhiều ngôn ngữ liên tiếp
        # trong cùng 1 request có thể vượt 60s. Đây là giải pháp TẠM, không
        # phải fix cuối — hướng đúng là làm bất đồng bộ (xem DEPLOYMENT.md
        # mục "Dịch tự động"), để client không phải chờ lâu thế này.
        proxy_read_timeout 180s;
    }

    # Endpoint dùng cho readiness probe cấp Nginx nếu cần (vd: uptime monitor bên ngoài).
    location = /api/v1/health/live {
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Mọi thứ còn lại (trang HTML, asset) đi qua Angular SSR.
    location / {
        proxy_pass http://blog_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
