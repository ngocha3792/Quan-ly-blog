# Nginx reverse proxy — Blog API + Blog Frontend.
# Domain chính: blogy.id.vn — www.blogy.id.vn luôn redirect về domain gốc.

# Blue-green: upstream blog_api được định nghĩa trong
# /etc/nginx/blogy/upstream-current.conf — một symlink runtime (không
# commit, tạo/đổi bởi scripts/switch-slot.sh) trỏ vào upstream-blue.conf
# hoặc upstream-green.conf (đều nằm trong docker/nginx-blogy/, có commit).
# Đổi slot = đổi symlink + `nginx -s reload`, không sửa file này.
include /etc/nginx/blogy/upstream-current.conf;

# SSR server của Angular (blog-frontend). Bỏ khối này nếu chỉ deploy API.
upstream blog_frontend {
    server frontend:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name blogy.id.vn www.blogy.id.vn;

    client_max_body_size 20m;

    # Certbot webroot challenge — phải phục vụ được qua HTTP thường,
    # kể cả sau khi đã bật redirect sang HTTPS bên dưới.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mọi request HTTP khác redirect thẳng sang domain gốc HTTPS,
    # kể cả nếu gõ www — không dùng $host để tránh giữ lại "www.".
    location / {
        return 301 https://blogy.id.vn$request_uri;
    }
}

# www.blogy.id.vn qua HTTPS: chỉ redirect về domain gốc, không phục vụ gì khác.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.blogy.id.vn;

    ssl_certificate     /etc/nginx/certs/live/blogy.id.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/blogy.id.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://blogy.id.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blogy.id.vn;

    ssl_certificate     /etc/nginx/certs/live/blogy.id.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/blogy.id.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # API luôn ở dưới /api/v1/*, khớp trước để không bị "location /" nuốt mất.
    location /api/v1/ {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # Tạm tăng lên 180s (mặc định 60s) để có thời gian test tính năng
        # dịch tự động — request tạo/sửa bài dịch nhiều ngôn ngữ liên tiếp
        # trong cùng 1 request có thể vượt 60s. Đây là giải pháp TẠM, không
        # phải fix cuối — hướng đúng là làm bất đồng bộ (xem DEPLOYMENT.md
        # mục "Dịch tự động"), để client không phải chờ lâu thế này.
        proxy_read_timeout 180s;
    }

    # Endpoint dùng cho readiness probe cấp Nginx nếu cần (vd: uptime monitor bên ngoài).
    location = /api/v1/health/live {
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Mọi thứ còn lại (trang HTML, asset) đi qua Angular SSR.
    location / {
        proxy_pass http://blog_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
