# Nginx reverse proxy starter cho Blog API.
# Đổi "api.example.com" thành domain thật và gắn certificate TLS thật
# (Let's Encrypt/Certbot, hoặc TLS tại load balancer) trước khi dùng production.
#
# File này CHỦ Ý chỉ bật HTTP (port 80) sẵn để `nginx -t` pass ngay khi
# chưa có certificate. Khối HTTPS bên dưới đang comment, bỏ comment và
# trỏ đúng đường dẫn cert/key khi đã có TLS.

upstream blog_api {
    # Nếu scale nhiều API replica, Docker DNS round-robin qua tên service "api".
    server api:8080;
}

# SSR server của Angular (blog-frontend). Bỏ khối này nếu chỉ deploy API.
upstream blog_frontend {
    server frontend:4000;
}

server {
    listen 80;
    listen [::]:80;
    # "_" = catch-all, phục vụ luôn qua IP. Đổi thành domain thật khi có DNS.
    server_name _;

    client_max_body_size 20m;

    # Bỏ comment khối này sau khi có certificate để tự động redirect sang HTTPS.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # API luôn ở dưới /api/v1/*, khớp trước để không bị "location /" nuốt mất.
    location /api/v1/ {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # Tạm tăng lên 180s (mặc định 60s) để có thời gian test tính năng
        # dịch tự động — request tạo/sửa bài dịch nhiều ngôn ngữ liên tiếp
        # trong cùng 1 request có thể vượt 60s. Đây là giải pháp TẠM, không
        # phải fix cuối — hướng đúng là làm bất đồng bộ (xem DEPLOYMENT.md
        # mục "Dịch tự động"), để client không phải chờ lâu thế này.
        proxy_read_timeout 180s;
    }

    # Endpoint dùng cho readiness probe cấp Nginx nếu cần (vd: uptime monitor bên ngoài).
    location = /api/v1/health/live {
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Mọi thứ còn lại (trang HTML, asset) đi qua Angular SSR.
    location / {
        proxy_pass http://blog_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

